<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Edu Digital - Aplikasi Rekap Guru</title>
  <style>
    /* Menghilangkan scrollbar dan margin bawaan browser */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f4f6; /* Warna dasar selagi memuat */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Iframe dibuat penuh 100% layar handphone maupun laptop */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/macros/s/AKfycbxEKSbQLuSDjpW20dWTsZk8yhIgjzn9CPkChdOUBdYof-MjH0on1s-p_3lhkSp38JlNbQ/exec" 
          allow="geolocation; microphone; camera; clipboard-write">
  </iframe>

</body>
</html>
